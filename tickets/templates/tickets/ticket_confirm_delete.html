{% extends 'base.html' %}

{% block content %}
<h1>Eliminar Ticket</h1>
<p>¿Seguro que quieres eliminar el ticket "{{ ticket.titulo }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar</button>
    <a href="{% url 'tickets:listar_tickets' %}">Cancelar</a>
</form>
{% endblock %}
