<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TI Platform{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #333; color: white; padding: 10px; margin-bottom: 20px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1000px; margin: 0 auto; }
    </style>
</head>
<body>
    <nav>
        <h2 style="margin: 0; display: inline;">TI Platform</h2>
        <br>
        <a href="{% url 'it_admin:home_it' %}">Activos IT</a>
        <a href="{% url 'tickets:listar_tickets' %}">Tickets</a>
        <a href="/admin/">Admin</a>
        {% if user.is_authenticated %}
            <span style="float: right;">{{ user.username }} | <a href="/accounts/logout/">Logout</a></span>
        {% else %}
            <span style="float: right;"><a href="/accounts/login/">Login</a></span>
        {% endif %}
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
